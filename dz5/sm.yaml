apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: homework-otus-dz5
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app.kubernetes.io/instance: homework
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
