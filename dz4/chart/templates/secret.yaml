apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secretName }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.postgres.host | quote }}
  port: {{ .Values.postgres.port | quote }}
  user: {{ .Values.postgres.user | quote }}
  database: {{ .Values.postgres.database | quote }}
  password: {{ .Values.postgres.password | required "задайте --set postgres.password=..." | quote }}
